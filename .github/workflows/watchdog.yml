name: watchdog
# Watches the GCP host from outside: a different company, so a host that stops
# entirely is still noticed. Reads the public address through the gateway.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: monitor snapshot must be no more than 10 minutes old
        run: python3 deploy/watchdog.py https://pamon.hyunsuhahaha.workers.dev/data/api/v1/overview.json
