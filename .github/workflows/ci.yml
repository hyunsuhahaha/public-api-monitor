name: ci
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 KST: are all monitored endpoints still there?
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/pamon

  deploy-code:
    # Terraform and Ansible are checked without any cloud account: syntax, types, lint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deploy/terraform/oci fmt -check -recursive
      - run: terraform -chdir=deploy/terraform/oci init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform/oci validate
      - run: pipx install ansible-core && ansible-galaxy collection install ansible.posix community.general
      - name: ansible syntax check
        working-directory: deploy/ansible
        run: |
          cp inventory.example.ini inventory.ini
          echo 'vault_ingest_token: ci' > group_vars/all/vault.yml
          ansible-playbook site.yml --syntax-check
      - name: prometheus rules check and unit tests
        run: |
          docker run --rm -v "$PWD/deploy:/rules" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD/deploy:/rules" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml
      - name: grafana dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana/dashboards/pamon.json > /dev/null

  endpoints:
    # Every target is called once with a dummy key: a live data.go.kr path answers "key not
    # registered", a retired or mistyped one "no such service" (code 12). Seoul APIs take
    # the public "sample" key. Fails when an API we monitor has been retired.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go run ./cmd/pamon -once -paths
        env:
          DATA_GO_KR_KEY: dummy-not-a-key
          SEOUL_OPENAPI_KEY: sample
          SEOUL_SUBWAY_KEY: sample

  image:
    # amd64 + arm64 (the OCI Always Free central is ARM). Pushed to GHCR from main only.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
