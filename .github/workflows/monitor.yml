name: monitor
# The live deployment: every 5 minutes one cycle checks all targets into the SQLite
# database (kept between runs in the Actions cache), then the dashboard and status page
# are published with their data to GitHub Pages. No server to keep up; the price is that
# the checks come from a US runner.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write # refresh the encrypted daily backup on the db-seed release
  actions: write # delete the previous database cache
  pages: write
  id-token: write
concurrency:
  group: monitor # one writer to the database at a time; runs queue instead of racing
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: CGO_ENABLED=0 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o pamon ./cmd/pamon

      - name: restore database
        id: db
        uses: actions/cache/restore@v4
        with:
          path: pamon.db*
          key: pamon-db-${{ github.run_id }}
          restore-keys: pamon-db-
      - name: first run only - seed from the encrypted history of the home server
        if: steps.db.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_KEY: ${{ secrets.PAMON_SEED_KEY }}
        run: |
          gh release download db-seed -p pamon.db.gz.gpg
          gpg --batch --passphrase "$SEED_KEY" -d pamon.db.gz.gpg | gunzip > pamon.db

      - name: check every target once, export the site
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          SEOUL_SUBWAY_KEY: ${{ secrets.SEOUL_SUBWAY_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
          NAVER_MAPS_CLIENT_SECRET: ${{ secrets.NAVER_MAPS_CLIENT_SECRET }}
          PAMON_WEBHOOK_URL: ${{ secrets.PAMON_WEBHOOK_URL }}
          # The address handed out: the access gateway in front of Pages, so visits are counted.
          PAMON_PUBLIC_URL: https://pamon.hyunsuhahaha.workers.dev/
          PAMON_SITE_URL: https://pamon.hyunsuhahaha.workers.dev/
          # Public values that ship in every page: Web Analytics token, search-engine ownership tags
          PAMON_CF_BEACON: ${{ vars.PAMON_CF_BEACON }}
          PAMON_GOOGLE_VERIFY: ${{ vars.PAMON_GOOGLE_VERIFY }}
          PAMON_NAVER_VERIFY: ${{ vars.PAMON_NAVER_VERIFY }}
        run: ./pamon -cycle -db pamon.db -location github-actions -export site

      - name: save database
        uses: actions/cache/save@v4
        with:
          path: pamon.db*
          key: pamon-db-${{ github.run_id }}
      # The Actions cache is not storage: GitHub may evict it. Once a day the database also
      # goes, encrypted, to the db-seed release, which a run with no cache restores from,
      # so losing the cache costs at most a day of history.
      - name: daily backup
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_KEY: ${{ secrets.PAMON_SEED_KEY }}
        run: |
          last=$(gh release view db-seed --json assets --jq '.assets[] | select(.name=="pamon.db.gz.gpg") | .createdAt')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 86400 ]; then echo "backup is fresh ($last)"; exit 0; fi
          gzip -c pamon.db | gpg --batch --yes --pinentry-mode loopback --passphrase "$SEED_KEY" -c -o pamon.db.gz.gpg
          gh release upload db-seed pamon.db.gz.gpg --clobber
      - name: drop older database caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key pamon-db- --limit 100 --json key --jq '.[].key' |
            grep -vx "pamon-db-${{ github.run_id }}" | xargs -r -n1 gh cache delete || true

      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4

      # Scheduled runs come late or, for hours, not at all, so each run starts the next one
      # 5 minutes after it began; the cron above only restarts the chain if it ever breaks.
      # A run already queued or running means a chain exists: then this one stops here.
      - name: next beat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( 300 - ($(date +%s) - T0) ))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          busy=$(gh run list --workflow monitor.yml --limit 20 --json databaseId,status             --jq '[.[] | select(.databaseId != ${{ github.run_id }} and .status != "completed")] | length')
          if [ "$busy" = 0 ]; then gh workflow run monitor.yml --ref main; else echo "a run is already waiting"; fi
