name: handoff
# One-off move to the GCP host: the newest database snapshot and the monitor's settings,
# encrypted to deploy/gcp/handoff.pub.asc (a key only the operator's machine holds), as
# a one-day artifact. Shares the monitor's concurrency group, so it never runs beside a
# check. Delete this workflow once the host runs.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: CGO_ENABLED=0 go build -o pamon ./cmd/pamon
      - name: newest database
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_KEY: ${{ secrets.PAMON_SEED_KEY }}
          BACKUP_TOKEN: ${{ secrets.PAMON_BACKUP_TOKEN }}
        run: bash deploy/backup/db.sh restore && ./pamon -db pamon.db -snapshot handoff.db
      - name: encrypt database and settings
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          SEOUL_SUBWAY_KEY: ${{ secrets.SEOUL_SUBWAY_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
          NAVER_MAPS_CLIENT_SECRET: ${{ secrets.NAVER_MAPS_CLIENT_SECRET }}
          PAMON_WEBHOOK_URL: ${{ secrets.PAMON_WEBHOOK_URL }}
        run: |
          umask 077
          {
            for k in DATA_GO_KR_KEY SEOUL_OPENAPI_KEY SEOUL_SUBWAY_KEY KAKAO_REST_API_KEY NAVER_MAPS_CLIENT_ID NAVER_MAPS_CLIENT_SECRET PAMON_WEBHOOK_URL; do
              printf '%s=%s\n' "$k" "${!k}"
            done
            echo "PAMON_PUBLIC_URL=https://pamon.hyunsuhahaha.workers.dev/"
            echo "PAMON_SITE_URL=https://pamon.hyunsuhahaha.workers.dev/"
            echo "PAMON_CF_BEACON=${{ vars.PAMON_CF_BEACON }}"
            echo "PAMON_GOOGLE_VERIFY=${{ vars.PAMON_GOOGLE_VERIFY }}"
            echo "PAMON_NAVER_VERIFY=${{ vars.PAMON_NAVER_VERIFY }}"
          } > pamon.env
          # the backup passphrase, so the dated release copies stay readable outside GitHub
          printf '%s' "${{ secrets.PAMON_SEED_KEY }}" > seed.key
          tar czf handoff.tgz handoff.db pamon.env seed.key
          rm -f seed.key
          gpg --batch --import deploy/gcp/handoff.pub.asc
          gpg --batch --yes --trust-model always -r handoff@pamon.invalid -e -o handoff.tgz.gpg handoff.tgz
          rm -f pamon.env handoff.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: handoff
          path: handoff.tgz.gpg
          retention-days: 1
