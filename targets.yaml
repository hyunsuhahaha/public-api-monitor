# Monitored APIs. Each url is a Go text/template:
#   {{.Key}}                  the service key from key_env (query-escaped)
#   {{.Now}}                  now in KST
#   {{date .Now "20060102"}}  format a time      {{addHours .Now -1}} / addDays / addMonths
#   {{baseDate .Now 40}} {{baseTime .Now 40}}    기상청 초단기 base_date / base_time
#   {{vilageBaseDate .Now}} {{vilageBaseTime .Now}}  기상청 단기예보 (02, 05, ..., 23시 발표)
#   {{midTmFc .Now}}                             기상청 중기예보 (06시·18시 발표)
#   {{yearMonth (addMonths .Now -1)}}            last month as YYYYMM
#   {{esc "서울"}}             query-escape a literal
#
# Keys: DATA_GO_KR_KEY = 공공데이터포털 "일반 인증키(Decoding)". Each API must be 활용신청-ed
# separately on data.go.kr. SEOUL_OPENAPI_KEY = 서울 열린데이터광장 일반 인증키,
# SEOUL_SUBWAY_KEY = 서울 열린데이터광장 실시간 지하철 인증키 (both work with "sample").
#
# Every data.go.kr path below was checked to exist on 2026-10-18 (a dummy key gets
# 403 / code 30 "key not registered"; a wrong or retired path gets 400 / code 12). Query
# parameters still need a real key to confirm: pamon -once
interval: 5m
timeout: 10s
slow_after: 3s
key_env: DATA_GO_KR_KEY

# Announced maintenance (공지된 점검): verdicts inside a window are kept, marked 점검 중,
# and left out of uptime, SLOs, incidents and alerts. match takes target ids or providers.
# maintenance:
#   - match: [한국환경공단]
#     start: 2026-10-25T02:00:00+09:00
#     end: 2026-10-25T04:00:00+09:00
#     note: 에어코리아 정기 점검 (공지 링크)
maintenance: []

targets:
  # ── 날씨 (기상청) ─────────────────────────────────────────────────────────
  - id: kma-ultra-ncst
    name: 기상청 초단기실황
    provider: 기상청
    category: 날씨
    docs: https://www.data.go.kr/data/15084084/openapi.do
    url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?serviceKey={{.Key}}&pageNo=1&numOfRows=10&dataType=JSON&base_date={{baseDate .Now 40}}&base_time={{baseTime .Now 40}}&nx=60&ny=127
    expect:              # 온도·습도가 말이 되는지 (200이어도 값이 틀리면 데이터 이상)
      - name: 기온(T1H)
        pattern: '"category":"T1H"[^}]*"obsrValue":"(-?[\d.]+)"'
        min: -40
        max: 45
      - name: 습도(REH)
        pattern: '"category":"REH"[^}]*"obsrValue":"(-?[\d.]+)"'
        min: 0
        max: 100

  - id: kma-ultra-fcst
    name: 기상청 초단기예보
    provider: 기상청
    category: 날씨
    docs: https://www.data.go.kr/data/15084084/openapi.do
    url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtFcst?serviceKey={{.Key}}&pageNo=1&numOfRows=10&dataType=JSON&base_date={{baseDate .Now 45}}&base_time={{baseTime .Now 45}}&nx=60&ny=127

  - id: kma-vilage-fcst
