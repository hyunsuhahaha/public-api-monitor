# Image built and pushed by CI (multi-arch: the OCI A1 central is arm64).
pamon_image: ghcr.io/hyunsuhahaha/public-api-monitor:latest
pamon_dir: /opt/pamon

# Public hostname of the central. With a domain Caddy gets a Let's Encrypt certificate;
# empty serves plain HTTP on :80 by IP.
pamon_domain: ""
pamon_central_url: "{{ 'https://' + pamon_domain if pamon_domain else 'http://' + hostvars[groups['central'][0]].ansible_host }}"

# Secrets come from group_vars/all/vault.yml (ansible-vault): see vault.yml.example
pamon_data_go_kr_key: "{{ vault_data_go_kr_key | default('') }}"
pamon_seoul_openapi_key: "{{ vault_seoul_openapi_key | default('sample') }}"
pamon_seoul_subway_key: "{{ vault_seoul_subway_key | default('sample') }}"
pamon_ingest_token: "{{ vault_ingest_token }}"
pamon_admin_token: "{{ vault_admin_token | default('') }}"
pamon_webhook_url: "{{ vault_webhook_url | default('') }}"
