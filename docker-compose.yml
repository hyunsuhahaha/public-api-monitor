# Local stack: the monitor, Prometheus (with the self-SLO alert rules), Grafana with the
# pamon dashboard provisioned, and Jaeger for traces. http://localhost:8080 page,
# :9090 Prometheus, :3000 Grafana, :16686 Jaeger.
services:
  pamon:
    build: .
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318 # traces of every check
    ports: ["8080:8080"]
    volumes: ["pamon-data:/data"]
    restart: unless-stopped
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"] # UI; OTLP/HTTP on 4318 inside the network
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
volumes:
  pamon-data:
