<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pamon · 공공 API 상태판</title>
<meta name="description" content="한국 공공 API의 실시간 가용성, 응답 시간, SLO와 장애 기록">
<link rel="alternate" type="application/atom+xml" title="장애 피드" href="/feed.xml">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">◆</span><b>pamon</b><span class="sub">공공 API 상태판</span></div>
  <div id="fleet-pill" class="pill">…</div>
  <div class="spacer"></div>
  <div class="ranges" id="ranges"></div>
  <button class="btn" id="refresh" title="새로고침">⟳ <span id="age">–</span></button>
  <nav class="links"><a href="/report">월간 리포트</a><a href="/feed.xml">피드</a><a href="/api/v1/overview">API</a></nav>
</header>

<main class="grid">
  <section class="stats" id="stats"></section>

  <section class="panel wide">
    <div class="panel-h">
      <h2>서비스</h2>
      <div class="tools">
        <input id="q" type="search" placeholder="API·기관 검색" autocomplete="off">
        <div class="chips" id="cats"></div>
      </div>
    </div>
    <div class="table-wrap">
      <table class="svc">
        <thead><tr>
          <th></th><th>API</th><th class="num" data-sort="availability">가용률</th><th data-sort="budgetLeft">에러 버짓</th>
          <th class="num" data-sort="p50">p50</th><th class="num" data-sort="p95">p95</th><th>p95 추이</th><th>상태 기록</th><th>지역</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel half">
    <div class="panel-h"><h2>가용률 히트맵</h2><span class="hint" id="heat-hint"></span></div>
    <canvas id="heat"></canvas>
    <div class="legend"><i class="c-ok"></i>정상 <i class="c-deg"></i>저하 <i class="c-out"></i>장애 <i class="c-none"></i>기록 없음</div>
  </section>

  <section class="panel half">
    <div class="panel-h"><h2>장애 타임라인</h2><span class="hint" id="inc-count"></span></div>
    <div id="gantt"></div>
    <div id="inc-list"></div>
  </section>
</main>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-h">
    <div><div class="d-title" id="d-title"></div><div class="d-sub" id="d-sub"></div></div>
    <button class="btn" id="d-close">✕</button>
  </div>
  <div class="d-stats" id="d-stats"></div>
  <div class="d-panel"><h3>응답 시간 (전체 지역, 정상 응답)</h3><div id="d-lat"></div></div>
  <div class="d-panel"><h3>지역별 p95</h3><div id="d-loc"></div></div>
  <div class="d-panel"><h3>지역별 상태</h3><canvas id="d-strips"></canvas></div>
  <div class="d-panel"><h3>장애</h3><div id="d-inc"></div></div>
  <div class="d-panel"><h3>최근 확인</h3><div class="table-wrap"><table class="log" id="d-log"></table></div></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<footer class="foot">
  응답 본문의 결과 코드까지 읽어 판정합니다. 키·호출 한도 같은 감시 쪽 문제는 가용률에서 제외하고, 여러 지역에서는 과반수가 실패해야 장애입니다.
  <a href="https://github.com/hyunsuhahaha/public-api-monitor">GitHub</a>
</footer>
<script src="vendor/uPlot.iife.min.js"></script>
<script src="app.js"></script>
</body>
</html>
