<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공공 API 상태 · pamon</title>
<meta name="description" content="공공데이터포털·서울 열린데이터광장 API가 지금 쓸 수 있는지, 지난 90일 동안 어땠는지">
<style>
:root { --bg: #f7f8fa; --card: #fff; --line: #e3e6ea; --text: #1d2125; --muted: #6b7280;
  --ok: #3fa34d; --deg: #e0a800; --out: #d64545; --none: #d9dde3; --maint: #8b5cf6; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1013; --card: #16191d; --line: #262a30; --text: #e4e6e9; --muted: #8b919a; --none: #2b2f36; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
a { color: inherit; }
.muted { color: var(--muted); font-size: 12px; }
.banner { margin: 18px 0 22px; padding: 16px 18px; border-radius: 8px; color: #fff; font-weight: 600; font-size: 16px; }
.banner.ok { background: var(--ok); } .banner.deg { background: var(--deg); color: #1d2125; } .banner.out { background: var(--out); }
.banner small { display: block; font-weight: 400; font-size: 13px; opacity: .9; margin-top: 2px; }
.group { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
.group > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary .st { font-weight: 500; font-size: 13px; }
.api { padding: 12px 16px; border-top: 1px solid var(--line); }
.api-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.api-h b { font-weight: 500; }
.st.ok { color: var(--ok); } .st.deg { color: var(--deg); } .st.out { color: var(--out); } .st.maint { color: var(--maint); } .st.none { color: var(--muted); }
.bars { display: flex; gap: 2px; height: 30px; margin: 8px 0 4px; }
.bars i { flex: 1; border-radius: 2px; background: var(--none); min-width: 2px; }
.bars i.ok { background: var(--ok); } .bars i.deg { background: var(--deg); } .bars i.out { background: var(--out); }
.bars i:hover { opacity: .7; }
.scale { display: flex; justify-content: space-between; }
.tip { position: fixed; pointer-events: none; background: #1d2125; color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 4px; display: none; z-index: 9; max-width: 260px; }
h2 { font-size: 15px; margin: 30px 0 10px; }
.inc { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; margin-bottom: 8px; }
.inc .t { font-weight: 500; }
@media (max-width: 560px) { .bars i:nth-child(-n+60) { display: none; } .scale .d90 { display: none; } .scale .d30 { display: inline; } }
.scale .d30 { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>공공 API 상태</h1>
    <span class="muted">5분마다 실제로 호출해 확인 · <a href="/">운영자 상태판</a> · <a href="/feed.xml">장애 피드</a></span>
  </header>
  <div class="banner" id="banner">불러오는 중…</div>
  <div id="groups"></div>
  <h2>최근 14일 장애</h2>
  <div id="incs"></div>
  <p class="muted">초록은 정상, 노랑은 느리거나 데이터 갱신이 멈춤, 빨강은 실패한 확인이 있던 날입니다. 우리 쪽 키·승인 문제와 공지된 점검 시간은 계산에서 뺍니다.</p>
</main>
<div class="tip" id="tip"></div>
<script src="status.js"></script>
</body>
</html>
